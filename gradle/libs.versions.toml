[versions]
androidBaselineProfileMinSdk = "28"
androidCompileSdk = "37"
androidGradlePlugin = "9.4.1"
androidJunit = "1.1.3"
androidMinSdk = "24"
androidTargetSdk = "37"
androidWearMinSdk = "25"
androidWearTargetSdk = "33"
baselineprofile = "1.5.0"
benchmark = "1.5.0"
composeMultiplatform = "1.12.1"
composeVectorize = "1.3.0"
dependencyGraphGenerator = "0.8.0"
firebasePerf = "2.0.2"
fonament = "0.0.1-alpha07"
jdk = "21"
jetbrainsNavigation = "2.9.2"
junit = "4.13.2"
