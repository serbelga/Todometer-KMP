navigationComposeExtended = "1.6.2"
pigment = "0.7.0"
sqlDelight = "2.4.0"
wearCompose = "1.7.0"
work = "2.12.0"

[libraries]
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }

androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }

androidx-wear-compose-uiTooling = { module = "androidx.wear.compose:compose-ui-tooling", version.ref = "wearCompose" }

androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }

dependencyGraphGenerator = { module = "com.vanniktech:gradle-dependency-graph-generator-plugin", version.ref = "dependencyGraphGenerator" }

google-firebase-firebasePerf = { module = "com.google.firebase:firebase-perf" }

jetbrains-androidx-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "jetbrainsNavigation" }

jetbrains-compose-componentsResources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }

sergiobelda-composeVectorize-core = { module = "dev.sergiobelda.compose.vectorize:compose-vectorize-core", version.ref = "composeVectorize" }
sergiobelda-fonament-preferences = { module = "dev.sergiobelda.fonament:fonament-preferences", version.ref = "fonament" }
sergiobelda-fonament-preferencesDiKoin = { module = "dev.sergiobelda.fonament:fonament-preferences-di-koin", version.ref = "fonament" }
sergiobelda-fonament-presentation = { module = "dev.sergiobelda.fonament:fonament-presentation", version.ref = "fonament" }
sergiobelda-fonament-presentationDiKoin = { module = "dev.sergiobelda.fonament:fonament-presentation-di-koin", version.ref = "fonament" }
sergiobelda-navigationComposeExtended = { module = "dev.sergiobelda.navigation.compose.extended:navigation-compose-extended", version.ref = "navigationComposeExtended" }
sergiobelda-navigationComposeExtendedAnnotation = { module = "dev.sergiobelda.navigation.compose.extended:navigation-compose-extended-annotation", version.ref = "navigationComposeExtended" }
sergiobelda-navigationComposeExtendedCompiler = { module = "dev.sergiobelda.navigation.compose.extended:navigation-compose-extended-compiler", version.ref = "navigationComposeExtended" }
sergiobelda-navigationComposeExtendedWear = { module = "dev.sergiobelda.navigation.compose.extended:navigation-compose-extended-wear", version.ref = "navigationComposeExtended" }
sergiobelda-pigment = { module = "dev.sergiobelda.pigment:pigment", version.ref = "pigment" }

sqldelight-androidDriver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqlDelight" }
sqldelight-jvmDriver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqlDelight" }
sqldelight-nativeDriver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqlDelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqlDelight" }
sqldelight-primitiveAdapters = { module = "app.cash.sqldelight:primitive-adapters", version.ref = "sqlDelight" }

[plugins]
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
dependencyGraphGenerator = { id = "com.vanniktech.dependency.graph.generator", version.ref = "dependencyGraphGenerator" }
google-firebasePerf = { id = "com.google.firebase.firebase-perf", version.ref = "firebasePerf" }
sergiobelda-composeVectorize = { id = "dev.sergiobelda.compose.vectorize", version.ref = "composeVectorize" }
sqlDelight = { id = "app.cash.sqldelight", version.ref = "sqlDelight" }

sergiobelda-gradle-common-library-android = { id = "dev.sergiobelda.gradle.common.library.android" }
sergiobelda-gradle-common-ui = { id = "dev.sergiobelda.gradle.common.ui" }
sergiobelda-gradle-common-uiToolingPreview = { id = "dev.sergiobelda.gradle.common.ui.tooling.preview" }
sergiobelda-gradle-dependencyGraphGenerator = { id = "dev.sergiobelda.gradle.dependency-graph-generator" }
